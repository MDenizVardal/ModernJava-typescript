<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizMaster</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1 class="app-title">QuizMaster</h1>
        <p class="app-subtitle">Test your knowledge</p>
      </header>

      <main class="quiz-container" id="quiz-container">
        <div class="progress-bar-wrapper">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <span class="progress-label" id="progress-label">Question 1 of 5</span>

        <section class="question-card" id="question-card">
          <p class="question-category" id="question-category">Science</p>
          <h2 class="question-text" id="question-text">
            What is the chemical symbol for water?
          </h2>
        </section>

        <div class="answers-grid" id="answers-grid">
          <button class="answer-btn" data-index="0">H₂O</button>
          <button class="answer-btn" data-index="1">CO₂</button>
          <button class="answer-btn" data-index="2">NaCl</button>
          <button class="answer-btn" data-index="3">O₂</button>
        </div>

        <div class="quiz-footer">
          <button class="btn-next" id="btn-next" disabled>Next →</button>
        </div>
      </main>

      <div class="results-screen hidden" id="results-screen">
        <div class="results-card">
          <div class="results-icon" id="results-icon">🎉</div>
          <h2 class="results-title">Quiz Complete!</h2>
          <p class="results-score" id="results-score">You scored 4 out of 5</p>
          <p class="results-message" id="results-message">Excellent work!</p>
          <button class="btn-restart" id="btn-restart">Play Again</button>
        </div>
      </div>
    </div>

    <script src="quiz.js"></script>
  </body>
</html>
